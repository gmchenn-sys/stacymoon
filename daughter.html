<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Stacy Moon · 妈妈今天怎么样</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans SC',sans-serif;
  background:#0a0a0f;color:#e2e2e8;
  min-height:100vh;max-width:420px;margin:0 auto;
  -webkit-font-smoothing:antialiased;
}
.header{
  padding:40px 24px 24px;
  text-align:center;
  background:linear-gradient(180deg,rgba(249,115,22,0.08),transparent);
}
.moon{font-size:44px;margin-bottom:12px}
.header h1{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.header p{font-size:13px;color:#8888a0;line-height:1.6}
.status-bar{
  margin:0 20px 24px;
  background:#12121a;border:1px solid rgba(249,115,22,0.2);
  border-radius:16px;padding:16px 20px;
  display:flex;align-items:center;gap:12px;
}
.dot{
  width:10px;height:10px;border-radius:50%;
  background:#555570;flex-shrink:0;
  transition: background 0.4s;
}
.dot.active{
  background:#F97316;
  box-shadow:0 0 8px rgba(249,115,22,0.6);
  animation:pulse 2s infinite;
}
.dot.recent{
  background:#22c55e;
  box-shadow:0 0 8px rgba(34,197,94,0.5);
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.status-text strong{color:#e2e2e8;display:block;font-size:14px;margin-bottom:2px}
.status-text span{font-size:12px;color:#8888a0}
.label{padding:0 24px 10px;font-size:11px;letter-spacing:1.5px;color:#444460}
.list{padding:0 20px;display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.card{
  background:#12121a;
  border:1px solid rgba(255,255,255,0.05);
  border-left:3px solid #F97316;
  border-radius:14px;padding:16px;
}
.card-time{font-size:11px;color:#555570;margin-bottom:8px}
.card-mom{font-size:13px;color:#e2e2e8;line-height:1.6;margin-bottom:6px}
.card-mom::before{content:"妈妈说 · ";color:#F97316;font-weight:600;font-size:12px}
.card-stacy{font-size:12px;color:#8888a0;line-height:1.6}
.card-stacy::before{content:"Stacy · ";color:#8B5CF6;font-weight:600}
.empty{text-align:center;padding:60px 20px;color:#444460}
.empty .icon{font-size:48px;margin-bottom:16px}
.empty p{font-size:14px;line-height:1.8}
.footer{text-align:center;padding:24px;font-size:11px;color:#2a2a40}
</style>
</head>
<body>

<div class="header">
  <div class="moon">🌙</div>
  <h1>妈妈今天怎么样</h1>
  <p>每次 Stacy 回复妈妈<br>这里都会更新</p>
</div>

<div class="status-bar">
  <div class="dot" id="status-dot"></div>
  <div class="status-text">
    <strong id="status-label">暂无对话</strong>
    <span id="last-time">今天还没有对话</span>
  </div>
</div>

<div class="label">今日对话记录</div>

<div class="list" id="log-list">
  <div class="empty">
    <div class="icon">🌙</div>
    <p>妈妈还没有说话<br>有消息会第一时间出现在这里</p>
  </div>
</div>

<div class="footer">Stacy Moon · 女儿守护版</div>

<script>
const SUPABASE_URL = window.SUPABASE_URL || 'https://gqahwfuuvoumfxdhfugt.supabase.co';
const SUPABASE_KEY = window.SUPABASE_KEY || 'sb_publishable_EBDC3H5J_WdUSWXmZwndJg_GsGBHN2S';

async function loadLogs() {
  const list = document.getElementById('log-list');
  const timeEl = document.getElementById('last-time');
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-label');

  let logs = [];

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/logs?select=*&order=created_at.desc&limit=20`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );
    const data = await res.json();
    logs = data.reverse(); // 时间正序
  } catch (e) {
    console.warn('Supabase 读取失败，回退到 localStorage:', e);
    logs = JSON.parse(localStorage.getItem('stacy_logs') || '[]');
  }

  if (logs.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="icon">🌙</div>
        <p>妈妈还没有说话<br>有消息会第一时间出现在这里</p>
      </div>`;
    dot.className = 'dot';
    label.textContent = '暂无对话';
    timeEl.textContent = '今天还没有对话';
    return;
  }

  // 判断最近对话时间
  const last = logs[logs.length - 1];
  const lastTime = last.created_at ? new Date(last.created_at) : null;
  const now = new Date();
  const diffMin = lastTime ? (now - lastTime) / 60000 : 999;

  // 格式化时间显示
  const timeStr = lastTime
    ? lastTime.getHours() + ':' + String(lastTime.getMinutes()).padStart(2, '0')
    : (last.time || '');

  if (diffMin < 30) {
    dot.className = 'dot active';
    label.textContent = 'Stacy 陪伴中';
  } else if (diffMin < 60 * 8) {
    dot.className = 'dot recent';
    label.textContent = '今日已陪伴';
  } else {
    dot.className = 'dot';
    label.textContent = '等待妈妈';
  }

  timeEl.textContent = '最近对话：' + timeStr;

  list.innerHTML = '';
  [...logs].reverse().forEach(log => {
    const card = document.createElement('div');
    card.className = 'card';
    const t = log.created_at
      ? (() => { const d = new Date(log.created_at); return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); })()
      : (log.time || '');
    card.innerHTML = `
      <div class="card-time">${t}</div>
      <div class="card-mom">${log.user_message || log.userMessage}</div>
      <div class="card-stacy">${log.ai_reply || log.aiReply}</div>
    `;
    list.appendChild(card);
  });
}

loadLogs();
setInterval(loadLogs, 5000);
</script>
</body>
</html>
