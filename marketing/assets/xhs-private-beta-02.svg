  <path d="M216 1150 C298 1075 405 1078 477 1162 C555 1077 676 1088 739 1160 C807 1085 928 1080 1010 1152" stroke="#2D9D91" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.65"/>
  <text x="168" y="1294" fill="#31534D" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="600">
    <tspan x="168" dy="0">这些变化，值得被记录，</tspan>
    <tspan x="168" dy="64">也值得被认真理解。</tspan>
