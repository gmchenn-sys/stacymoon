<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F7FFF9"/>
      <stop offset="0.55" stop-color="#FFF1E5"/>
      <stop offset="1" stop-color="#FAD5C7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#7B6A58" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1242" height="1660" fill="url(#bg2)"/>
  <circle cx="1024" cy="234" r="82" fill="#F5C65E" opacity="0.88"/>
  <circle cx="165" cy="1430" r="210" fill="#CDEBE4" opacity="0.9"/>
  <g filter="url(#shadow)">
    <rect x="112" y="126" width="1018" height="1308" rx="44" fill="#FFFDF7"/>
  </g>
  <text x="168" y="238" fill="#E86F5F" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">也许不是她“想太多”</text>
  <text x="168" y="365" fill="#20302C" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="68" font-weight="800">
    <tspan x="168" dy="0">如果妈妈最近</tspan>
    <tspan x="168" dy="96">常常这样</tspan>
  </text>
  <g transform="translate(168 560)" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif">
    <g>
      <circle cx="36" cy="36" r="36" fill="#E86F5F"/>
      <text x="22" y="50" font-size="38" font-weight="800" fill="#FFFFFF">1</text>
      <text x="104" y="50" font-size="48" font-weight="700" fill="#263A36">突然发热、出汗</text>
    </g>
    <g transform="translate(0 170)">
      <circle cx="36" cy="36" r="36" fill="#2D9D91"/>
      <text x="20" y="50" font-size="38" font-weight="800" fill="#FFFFFF">2</text>
      <text x="104" y="50" font-size="48" font-weight="700" fill="#263A36">半夜醒来睡不着</text>
    </g>
    <g transform="translate(0 340)">
      <circle cx="36" cy="36" r="36" fill="#F2B84B"/>
      <text x="20" y="50" font-size="38" font-weight="800" fill="#FFFFFF">3</text>
      <text x="104" y="50" font-size="48" font-weight="700" fill="#263A36">情绪起伏说不清</text>
    </g>
