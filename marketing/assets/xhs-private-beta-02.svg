  <rect x="168" y="1480" width="905" height="92" rx="46" fill="#20302C"/>
  <text x="218" y="1540" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700">关注公众号，回复【月亮】加入内测</text>
