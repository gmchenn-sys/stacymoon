<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
(function(){
  var s = parseFloat(localStorage.getItem('stacy_font_scale')) || 1;
  document.documentElement.style.fontSize = (16 * s) + 'px';
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stacy Moon">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <title>Stacy Moon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .voice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .voice-btn:hover {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.9);
    }
    .voice-btn.voice-active:not(.voice-speaking) {
      background: #F97316;
      color: #fff;
      animation: pulse-ring 1.4s ease-out infinite;
    }
    .voice-btn.voice-speaking {
      background: #EF4444;
      color: #fff;
      animation: pulse-stop 1.0s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(249,115,22,0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(249,115,22,0); }
      100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); }
    }
    @keyframes pulse-stop {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .first-chat-hint{text-align:center;font-size:0.7rem;color:rgba(255,255,255,0.25);padding:4px 0 0;display:none}
    .first-chat-hint.show{display:block}
    /* ── 重试按钮 ──────── */
    .retry-actions{display:flex;gap:8px;margin-top:10px}
    .retry-btn{
      padding:6px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.06);color:var(--text);font-family:inherit;
      font-size:0.75rem;cursor:pointer;transition:background 0.15s;
    }
    .retry-btn:active{background:rgba(255,255,255,0.12)}
    .retry-primary{background:rgba(249,115,22,0.15);border-color:rgba(249,115,22,0.3);color:var(--accent)}
    .retry-primary:active{background:rgba(249,115,22,0.25)}
    /* ── 加载动画 ──────── */
    .typing-bubble{color:var(--text-muted);font-size:0.82rem}
    .typing-dots{display:inline-flex;gap:2px}
    .typing-dots span{animation:dotBounce 1.2s ease-in-out infinite;opacity:0.2;font-size:0.7rem;line-height:1}
    .typing-dots span:nth-child(2){animation-delay:0.2s}
    .typing-dots span:nth-child(3){animation-delay:0.4s}
    @keyframes dotBounce{0%,100%{opacity:0.2}50%{opacity:1}}
    .avatar.breathing{animation:avatarBreathe 2s ease-in-out infinite}
    @keyframes avatarBreathe{0%,100%{opacity:0.6}50%{opacity:1}}
    .slow-hint{font-size:0.65rem;color:var(--text-muted);margin-top:6px;opacity:0.6;display:none}
    .slow-hint.show{display:block}
    /* ── 声波动画（TTS播放中）── */
    .soundwave{display:none;align-items:flex-end;gap:2px;margin-left:6px;height:18px}
    .soundwave.show{display:flex}
    .soundwave-bar{width:3px;border-radius:1px;background:var(--accent);opacity:0.5;animation:soundwavePulse 0.8s ease-in-out infinite alternate}
    .soundwave-bar:nth-child(1){height:6px;animation-delay:0s}
    .soundwave-bar:nth-child(2){height:12px;animation-delay:0.15s}
    .soundwave-bar:nth-child(3){height:16px;animation-delay:0.3s}
    .soundwave-bar:nth-child(4){height:8px;animation-delay:0.45s}
    @keyframes soundwavePulse{0%{opacity:0.3;transform:scaleY(0.5)}100%{opacity:0.9;transform:scaleY(1)}}
    .listening-hint{font-size:0.65rem;color:rgba(255,255,255,0.2);text-align:center;margin-top:4px;display:none}
    .listening-hint.show{display:block}
    .input-area.waiting .user-input,.input-area.waiting .send-btn{opacity:0.35;pointer-events:none}
    /* ── 底部导航栏 ──────── */
    .bottom-nav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;
      display:flex;justify-content:space-around;align-items:center;
      background:rgba(10,10,15,0.95);backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-top:1px solid rgba(255,255,255,0.06);
      padding:8px 0 max(8px,env(safe-area-inset-bottom));
      z-index:101;
    }
    .nav-tab{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 20px;text-decoration:none;color:#71717a;font-size:0.65rem;transition:color 0.2s;user-select:none;-webkit-tap-highlight-color:transparent}
    .nav-tab .nav-icon{font-size:20px;line-height:1}
    .nav-tab.active{color:#F97316}
    .nav-tab:active{opacity:0.7}
    /* input-area 让出 nav 空间 */
    .input-area{bottom:60px !important}
    .chat-box{padding-bottom:140px !important}
    /* 确保页面整体可滚动，header 在文档流顶部 */
    body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  </style>
</head>
<body>

  <!-- 邀请码弹窗 -->
  <div class="overlay" id="invite-overlay">
    <div class="invite-card">
      <div class="invite-moon">🌙</div>
      <h2 class="invite-title">欢迎使用 Stacy Moon</h2>
      <p class="invite-desc">请输入你的专属邀请码</p>
      <input
        type="text"
        id="invite-input"
        class="invite-input"
        placeholder="输入你的微信号"
        autocomplete="off"
      >
      <p class="invite-err" id="invite-err"></p>
      <button id="invite-btn" class="invite-btn">确认</button>
    </div>
  </div>

  <header class="header">
    <svg class="moon-logo" viewBox="0 0 64 64" width="64" height="64">
      <defs>
        <radialGradient id="moonGrad" cx="30%" cy="30%">
          <stop offset="0%" stop-color="#FFEDD5"/>
          <stop offset="100%" stop-color="#F97316"/>
        </radialGradient>
      </defs>
      <circle cx="32" cy="32" r="30" fill="url(#moonGrad)"/>
      <circle cx="42" cy="24" r="22" fill="#0a0a0f" opacity="0.9"/>
    </svg>
    <h1 class="title">Stacy Moon</h1>
    <p class="subtitle">有什么不舒服，告诉我</p>
    <div class="header-actions">
      <button class="header-icon-btn" id="history-btn" title="历史记录" onclick="location.href='chat_history.html'">📋</button>
      <button class="header-icon-btn danger" id="clear-btn" title="清空对话">🗑️</button>
    </div>
  </header>

  <main class="chat-box" id="chat-box">
    <div class="bubble-row ai">
      <span class="avatar">🌙</span>
      <div class="bubble ai-bubble" id="welcome-bubble">我在，有什么想说的都可以告诉我。🌙</div>
      <script>
        (function() {
          var bubble = document.getElementById('welcome-bubble');
          var profile = {};
          try { profile = JSON.parse(localStorage.getItem('stacy_profile') || '{}'); } catch {}
          var name = profile.name || '';
          var prefix = name ? name + '，' : '';

          // ── 优先级1: 有昨天打卡数据 ──
          var logs = [];
          try { logs = JSON.parse(localStorage.getItem('stacy_daily_logs') || '[]'); } catch {}
          var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
          var yesterdayStr = yesterday.toISOString().slice(0, 10);
          var yesterdayLog = logs.find(function(l) { return l.date === yesterdayStr; });

          var msg = '';

          if (yesterdayLog) {
            if (yesterdayLog.sleep_score && yesterdayLog.sleep_score <= 2) {
              msg = '昨晚睡得不太好？今天感觉怎么样，有没有好一点点？';
            } else if (yesterdayLog.mood === '😢' || yesterdayLog.mood === '😤') {
              msg = '昨天心情有些低落，今天好些了吗？我在这里陪你。';
            } else if (yesterdayLog.symptoms && yesterdayLog.symptoms.length > 0 && !(yesterdayLog.symptoms.length === 1 && yesterdayLog.symptoms[0] === 'none')) {
              var labels = { hot_flash:'潮热', night_sweat:'夜间出汗', poor_sleep:'睡眠', mood_swing:'情绪波动', joint_pain:'关节不舒服', brain_fog:'脑雾' };
              var sympNames = yesterdayLog.symptoms.filter(function(s) { return s !== 'none'; }).map(function(s) { return labels[s] || s; });
              msg = '昨天' + sympNames.slice(0, 2).join('、') + '有没有好一点？今天身体感觉怎么样？';
            } else {
              msg = '今天身体感觉怎么样？';
            }
          }

          // ── 优先级2: 有档案症状 ──
          if (!msg && Array.isArray(profile.symptoms) && profile.symptoms.length > 0 && !(profile.symptoms.length === 1 && profile.symptoms[0] === 'none')) {
            var symptomPrompts = {
              poor_sleep: '最近睡眠怎么样？有没有睡得好一点？',
              hot_flash: '今天有没有觉得燥热？',
              night_sweat: '最近夜间出汗有没有好一点？',
              mood_swing: '今天心情怎么样？',
              joint_pain: '关节这几天还疼吗？',
              brain_fog: '最近脑子清楚些了吗？'
            };
            var valid = profile.symptoms.filter(function(s) { return s !== 'none' && symptomPrompts[s]; });
            if (valid.length > 0) {
              var pick = valid[Math.floor(Math.random() * valid.length)];
              msg = symptomPrompts[pick] || '';
            }
          }

          // ── 优先级3: 固定文案 ──
          if (!msg) {
            var pool = ['今天身体感觉怎么样？', '有什么想和我说的吗？', '今天过得怎么样？'];
            msg = pool[Math.floor(Math.random() * pool.length)];
          }

          // 兜底
          if (!msg) msg = '我在，有什么想说的都可以告诉我。🌙';

          bubble.textContent = prefix + msg;
        })();
      </script>
      <script>
        // 首次聊天提示，显示一次后不再出现
        (function() {
          if (!localStorage.getItem('stacy_first_chat')) {
            localStorage.setItem('stacy_first_chat', '1');
            document.getElementById('first-chat-hint').classList.add('show');
          }
        })();
      </script>
    </div>
  </main>

  <footer class="input-area">
    <p class="notify-hint">每次对话，关心你的人都会收到通知</p>
    <div class="input-row">
      <button id="voice-btn" class="voice-btn" title="语音对话">
        <svg id="voice-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <input
        type="text"
        id="user-input"
        class="user-input"
        placeholder="在这里说…"
        autocomplete="off"
      >
      <button id="send-btn" class="send-btn">发送</button>
    </div>
    <p class="first-chat-hint" id="first-chat-hint">可以直接说话，也可以打字 👆</p>
    <p class="listening-hint" id="listening-hint">Stacy 正在听你说话…</p>
  </footer>

  <script>
  // ── 清空对话 ──────────────────────────
  document.getElementById('clear-btn').addEventListener('click', function() {
    if (!confirm('清空后记录无法恢复，确定要清空对话吗？')) return;
    localStorage.removeItem('stacy_logs');
    // 直接清空聊天框，只保留欢迎气泡
    var chatBox = document.getElementById('chat-box');
    chatBox.innerHTML = '<div class="bubble-row ai"><span class="avatar">🌙</span><div class="bubble ai-bubble" id="welcome-bubble">我在，有什么想说的都可以告诉我。🌙</div></div>';
    // 重新跑欢迎语
    var profile = {};
    try { profile = JSON.parse(localStorage.getItem('stacy_profile') || '{}'); } catch {}
    var name = profile.name || '';
    var prefix = name ? name + '，' : '';
    var pool = ['今天身体感觉怎么样？', '有什么想和我说的吗？', '今天过得怎么样？'];
    var msg = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('welcome-bubble').textContent = prefix + msg;
  });
  </script>

  <nav class="bottom-nav">
    <a class="nav-tab" href="home.html"><span class="nav-icon">🏠</span>首页</a>
    <span class="nav-tab active"><span class="nav-icon">🌙</span>聊天</span>
    <a class="nav-tab" href="weekly.html"><span class="nav-icon">📊</span>周报</a>
    <a class="nav-tab" href="history.html"><span class="nav-icon">📅</span>打卡</a>
    <a class="nav-tab" href="reminder.html"><span class="nav-icon">💊</span>用药</a>
  </nav>

  <script src="supabase.js?v=2"></script>
  <script src="api.js"></script>
  <script src="notify.js"></script>
  <script src="app.js?v=14"></script>

  <script>
  // ── 邀请码逻辑 ──────────────────────────
  (function() {
    const overlay = document.getElementById('invite-overlay');
    const input = document.getElementById('invite-input');
    const btn = document.getElementById('invite-btn');
    const err = document.getElementById('invite-err');

    // 已有邀请码 → 没建档的先去建档
    if (localStorage.getItem('stacy_invite_code')) {
      const profile = JSON.parse(localStorage.getItem('stacy_profile') || 'null');
      if (!profile || !profile.name) {
        window.location.replace('onboarding.html');
        return;
      }
      // 从首页点进来的 → 正常聊天；否则 → 先去首页
      if (sessionStorage.getItem('from_home') === '1') {
        sessionStorage.removeItem('from_home');
        overlay.style.display = 'none';
      } else {
        window.location.replace('home.html');
      }
      return;
    }

    async function submitCode() {
      const code = input.value.trim();
      if (!code) { err.textContent = '请输入微信号'; return; }

      btn.disabled = true;
      btn.textContent = '验证中…';
      err.textContent = '';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        // 用 ilike 做大小写不敏感匹配（微信号大小写不敏感）
        const res = await fetch(
          `${window.SUPABASE_URL}/rest/v1/invite_codes?code=ilike.${encodeURIComponent(code)}&select=code`,
          {
            headers: {
              'apikey': window.SUPABASE_KEY,
              'Authorization': `Bearer ${window.SUPABASE_KEY}`
            },
            signal: controller.signal
          }
        );
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data.length) {
          const matchedCode = data[0].code;
          localStorage.setItem('stacy_invite_code', matchedCode);

          // 从 Supabase 拉取已有档案（解决桌面快捷方式 localStorage 丢失问题）
          let profile = JSON.parse(localStorage.getItem('stacy_profile') || 'null');
          if (!profile || !profile.name) {
            try {
              const profileRes = await fetch(
                `${window.SUPABASE_URL}/rest/v1/profiles?code=ilike.${encodeURIComponent(matchedCode)}&select=profile`,
                {
                  headers: {
                    'apikey': window.SUPABASE_KEY,
                    'Authorization': `Bearer ${window.SUPABASE_KEY}`
                  }
                }
              );
              const profileData = await profileRes.json();
              if (profileData.length && profileData[0].profile) {
                profile = profileData[0].profile;
                localStorage.setItem('stacy_profile', JSON.stringify(profile));
              }
            } catch {}
          }

          overlay.style.display = 'none';
          // 检查是否需要建档
          if (!profile || !profile.name) {
            window.location.replace('onboarding.html');
          } else {
            window.location.replace('home.html');
          }
        } else {
          err.textContent = '邀请码无效，请核对后再试';
        }
      } catch (e) {
        err.textContent = '网络错误，请稍后再试';
      }

      btn.disabled = false;
      btn.textContent = '确认';
    }

    btn.addEventListener('click', submitCode);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
  })();
  </script>
</body>
</html>
