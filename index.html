<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stacy Moon</title>
  <script>
    window.DEEPSEEK_API_KEY = "sk-4c483cb60ccd4bc58ec5f2846c774063";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .voice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .voice-btn:hover {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.9);
    }
    .voice-btn.voice-active {
      background: #F97316;
      color: #fff;
      animation: pulse-ring 1.4s ease-out infinite;
    }
    .voice-btn.voice-speaking {
      background: #ea580c;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(249,115,22,0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(249,115,22,0); }
      100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); }
    }
  </style>
</head>
<body>

  <!-- 邀请码弹窗 -->
  <div class="overlay" id="invite-overlay">
    <div class="invite-card">
      <div class="invite-moon">🌙</div>
      <h2 class="invite-title">欢迎使用 Stacy Moon</h2>
      <p class="invite-desc">请输入女儿给你的邀请码</p>
      <input
        type="text"
        id="invite-input"
        class="invite-input"
        placeholder="输入邀请码，如 MOON001"
        autocomplete="off"
      >
      <p class="invite-err" id="invite-err"></p>
      <button id="invite-btn" class="invite-btn">确认</button>
    </div>
  </div>

  <header class="header">
    <svg class="moon-logo" viewBox="0 0 64 64" width="64" height="64">
      <defs>
        <radialGradient id="moonGrad" cx="30%" cy="30%">
          <stop offset="0%" stop-color="#FFEDD5"/>
          <stop offset="100%" stop-color="#F97316"/>
        </radialGradient>
      </defs>
      <circle cx="32" cy="32" r="30" fill="url(#moonGrad)"/>
      <circle cx="42" cy="24" r="22" fill="#0a0a0f" opacity="0.9"/>
    </svg>
    <h1 class="title">Stacy Moon</h1>
    <p class="subtitle">有什么不舒服，告诉我</p>
  </header>

  <main class="chat-box" id="chat-box">
    <div class="bubble-row ai">
      <span class="avatar">🌙</span>
      <div class="bubble ai-bubble">妈妈，我在。有什么不舒服，或者心里有什么想说的，都可以告诉我。🌙</div>
    </div>
  </main>

  <footer class="input-area">
    <p class="notify-hint">每次对话，女儿都会收到通知</p>
    <div class="input-row">
      <button id="voice-btn" class="voice-btn" title="语音对话">
        <svg id="voice-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <input
        type="text"
        id="user-input"
        class="user-input"
        placeholder="在这里说…"
        autocomplete="off"
      >
      <button id="send-btn" class="send-btn">发送</button>
    </div>
  </footer>

  <script src="supabase.js"></script>
  <script src="api.js"></script>
  <script src="notify.js"></script>
  <script src="app.js"></script>

  <script>
  // ── 邀请码逻辑 ──────────────────────────
  (function() {
    const overlay = document.getElementById('invite-overlay');
    const input = document.getElementById('invite-input');
    const btn = document.getElementById('invite-btn');
    const err = document.getElementById('invite-err');

    // 已有邀请码则不弹窗
    if (localStorage.getItem('stacy_invite_code')) {
      overlay.style.display = 'none';
      return;
    }

    async function submitCode() {
      const code = input.value.trim().toUpperCase();
      if (!code) { err.textContent = '请输入邀请码'; return; }

      btn.disabled = true;
      btn.textContent = '验证中…';
      err.textContent = '';

      try {
        const res = await fetch(
          `${window.SUPABASE_URL}/rest/v1/invite_codes?code=eq.${encodeURIComponent(code)}&select=code`,
          {
            headers: {
              'apikey': window.SUPABASE_KEY,
              'Authorization': `Bearer ${window.SUPABASE_KEY}`
            }
          }
        );
        const data = await res.json();
        if (data.length) {
          localStorage.setItem('stacy_invite_code', code);
          overlay.style.display = 'none';
        } else {
          err.textContent = '邀请码无效，请核对后再试';
        }
      } catch (e) {
        err.textContent = '网络错误，请稍后再试';
      }

      btn.disabled = false;
      btn.textContent = '确认';
    }

    btn.addEventListener('click', submitCode);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
  })();
  </script>
</body>
</html>
