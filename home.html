<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stacy Moon</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a0a0f;--accent:#F97316;--accent-glow:rgba(249,115,22,0.25);--text:#e4e4e7;
      --text-muted:#71717a;--surface:#12121a;--border:rgba(255,255,255,0.06);--radius:18px;
    }
    body{
      font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);
      max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
      -webkit-font-smoothing:antialiased;padding-bottom:40px;
    }

    /* ── 顶部栏 ─────────────── */
    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:20px 24px;flex-shrink:0;
    }
    .greeting{font-size:1.1rem;color:#fff;font-weight:500}
    .greeting .name{color:var(--accent);font-weight:700}
    .profile-btn{
      width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
      background:var(--surface);color:var(--text-muted);display:flex;align-items:center;
      justify-content:center;cursor:pointer;font-size:18px;transition:border-color 0.2s,color 0.2s;
    }
    .profile-btn:hover{border-color:var(--accent);color:var(--accent)}

    /* ── 打卡卡片 ───────────── */
    .checkin-card{
      margin:0 20px 24px;background:linear-gradient(135deg,rgba(249,115,22,0.12),rgba(139,92,246,0.08));
      border:1px solid rgba(249,115,22,0.15);border-radius:var(--radius);padding:24px 20px;
    }
    .checkin-title{font-size:0.78rem;color:var(--text-muted);letter-spacing:1px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .checkin-title .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .checkin-done{text-align:center;padding:12px 0}
    .checkin-done .icon{font-size:32px;margin-bottom:8px}
    .checkin-done .summary{font-size:0.9rem;color:var(--text);line-height:1.6}
    .checkin-done .time{font-size:0.72rem;color:var(--text-muted);margin-top:4px}

    /* ── 行 ─────────────── */
    .field-row{display:flex;align-items:center;margin-bottom:14px;gap:10px}
    .field-label{font-size:0.8rem;color:var(--text-muted);width:56px;flex-shrink:0}

    /* ── 心情 emoji ─────── */
    .mood-picker{display:flex;gap:8px;flex:1;flex-wrap:wrap}
    .mood-btn{
      width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
      font-size:22px;cursor:pointer;transition:border-color 0.2s,background 0.2s,transform 0.15s;
      display:flex;align-items:center;justify-content:center;
    }
    .mood-btn.selected{border-color:var(--accent);background:rgba(249,115,22,0.15);transform:scale(1.1)}
    .mood-btn:active{transform:scale(0.95)}

    /* ── 睡眠评分 ─────── */
    .sleep-picker{display:flex;gap:8px;flex:1}
    .sleep-btn{
      width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
      color:var(--text-muted);font-size:0.85rem;font-weight:600;cursor:pointer;
      transition:border-color 0.2s,background 0.2s,color 0.2s,transform 0.15s;
      display:flex;align-items:center;justify-content:center;
    }
    .sleep-btn.selected{border-color:var(--accent);background:var(--accent);color:#fff;transform:scale(1.08)}
    .sleep-btn:active{transform:scale(0.95)}

    /* ── 症状标签 ─────── */
    .tag-picker{display:flex;flex-wrap:wrap;gap:8px;flex:1}
    .tag-btn{
      padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
      color:var(--text-muted);font-size:0.8rem;cursor:pointer;white-space:nowrap;
      transition:border-color 0.2s,background 0.2s,color 0.2s;
    }
    .tag-btn.selected{border-color:var(--accent);background:rgba(249,115,22,0.15);color:var(--accent)}
    .tag-btn:active{background:rgba(249,115,22,0.25)}

    /* ── 备注 ──────────── */
    .note-input{
      flex:1;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
      color:var(--text);font-family:inherit;font-size:0.85rem;padding:0 12px;outline:none;
    }
    .note-input:focus{border-color:var(--accent)}
    .note-input::placeholder{color:#444}

    /* ── 提交按钮 ──────── */
    .submit-btn{
      width:100%;height:44px;border-radius:12px;border:none;margin-top:16px;
      background:var(--accent);color:#fff;font-family:inherit;font-size:0.9rem;font-weight:500;
      cursor:pointer;transition:opacity 0.2s,transform 0.15s;
    }
    .submit-btn:active{opacity:0.85;transform:scale(0.97)}
    .submit-btn:disabled{opacity:0.4;cursor:default}

    /* ── 今日任务卡片 ─────── */
    .task-card{
      margin:0 20px 24px;background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(16,185,129,0.05));
      border:1px solid rgba(34,197,94,0.12);border-radius:var(--radius);padding:20px;
    }
    .task-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .task-header .icon{font-size:20px}
    .task-header .label{font-size:0.72rem;color:#22c55e;letter-spacing:1px;font-weight:500}
    .task-body{font-size:0.95rem;color:#fff;line-height:1.6}
    .task-body .highlight{color:#22c55e;font-weight:600}
    .task-hint{font-size:0.72rem;color:var(--text-muted);margin-top:8px;line-height:1.5}
    .task-done-btn{
      display:inline-flex;align-items:center;gap:4px;margin-top:12px;padding:6px 16px;
      border-radius:20px;border:1px solid rgba(34,197,94,0.3);background:transparent;
      color:#22c55e;font-family:inherit;font-size:0.8rem;cursor:pointer;
      transition:background 0.2s;
    }
    .task-done-btn:active{background:rgba(34,197,94,0.1)}
    .task-done-btn.done{border-color:rgba(34,197,94,0.5);background:rgba(34,197,94,0.12)}
    .task-done-btn.done::before{content:'✅ '}

    /* ── 周报入口卡片 ─────── */
    .weekly-banner{
      margin:0 20px 24px;background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(99,102,241,0.05));
      border:1px solid rgba(139,92,246,0.12);border-radius:var(--radius);padding:16px 20px;
      display:flex;align-items:center;justify-content:space-between;cursor:pointer;
      transition:border-color 0.2s;
    }
    .weekly-banner:hover{border-color:rgba(139,92,246,0.3)}
    .weekly-banner:active{background:rgba(139,92,246,0.06)}
    .weekly-left{display:flex;align-items:center;gap:10px}
    .weekly-icon{font-size:24px}
    .weekly-info{line-height:1.4}
    .weekly-label{font-size:0.75rem;color:#a78bfa;letter-spacing:1px;font-weight:500}
    .weekly-preview{font-size:0.82rem;color:var(--text-muted)}
    .weekly-arrow{font-size:18px;color:var(--text-muted)}

    /* ── CTA 按钮 ───────────── */
    .cta-wrap{padding:0 20px;margin-bottom:24px}
    .cta-btn{
      width:100%;height:68px;border-radius:20px;border:none;
      background:linear-gradient(135deg,var(--accent),#ea580c);
      color:#fff;font-family:inherit;font-size:1.15rem;font-weight:600;
      cursor:pointer;transition:opacity 0.2s,transform 0.15s;
      box-shadow:0 8px 32px rgba(249,115,22,0.2);
    }
    .cta-btn:active{opacity:0.85;transform:scale(0.97)}

    /* ── 最近记录 ───────────── */
    .recent-section{padding:0 20px 40px}
    .recent-title{font-size:0.75rem;color:var(--text-muted);letter-spacing:1.5px;margin-bottom:12px}
    .log-item{
      padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
      margin-bottom:10px;
    }
    .log-time{font-size:0.7rem;color:var(--text-muted);margin-bottom:6px}
    .log-preview{font-size:0.85rem;color:var(--text);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .log-empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:0.85rem;line-height:1.8}
  </style>
</head>
<body>

<div class="topbar">
  <div class="greeting" id="greeting">你好</div>
  <button class="profile-btn" id="profile-btn" title="我的档案">📋</button>
</div>

<div class="checkin-card" id="checkin-card">
  <div class="checkin-title"><span class="dot"></span>今日身体打卡</div>
  <div id="checkin-content"></div>
</div>

<div class="task-card" id="task-card" style="display:none">
  <div class="task-header">
    <span class="icon">🎯</span>
    <span class="label">今日小任务</span>
  </div>
  <div class="task-body" id="task-body"></div>
  <div class="task-hint" id="task-hint"></div>
  <button class="task-done-btn" id="task-done-btn">点我标记完成</button>
</div>

<div class="cta-wrap">
  <button class="cta-btn" id="cta-btn">🌙 和 Stacy 说说话</button>
</div>

<a class="weekly-banner" id="weekly-banner" href="weekly.html" style="text-decoration:none;color:inherit;display:none">
  <div class="weekly-left">
    <span class="weekly-icon">📊</span>
    <div class="weekly-info">
      <div class="weekly-label">本周回顾</div>
      <div class="weekly-preview" id="weekly-preview"></div>
    </div>
  </div>
  <span class="weekly-arrow">→</span>
</a>

<div class="recent-section">
  <div class="recent-title">最近对话</div>
  <div id="log-list">
    <div class="log-empty">还没有对话记录<br>点上方按钮跟 Stacy 聊两句吧</div>
  </div>
</div>

<script src="supabase.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// ── 打卡配置 ────────────────────────────────
// ═══════════════════════════════════════════════════════════

const MOODS = [
  { emoji:'😊', label:'不错' },
  { emoji:'😐', label:'一般' },
  { emoji:'😤', label:'烦躁' },
  { emoji:'😢', label:'低落' },
  { emoji:'😴', label:'很累' },
];

const SYMPTOM_TAGS = [
  { key:'hot_flash', label:'潮热' },
  { key:'night_sweat', label:'出汗' },
  { key:'poor_sleep', label:'睡不好' },
  { key:'mood_swing', label:'情绪波动' },
  { key:'joint_pain', label:'关节疼' },
  { key:'brain_fog', label:'脑雾' },
];

const SYMPTOM_LABEL_MAP = {};
SYMPTOM_TAGS.forEach(s => SYMPTOM_LABEL_MAP[s.key] = s.label);

const STORAGE_KEY = 'stacy_daily_logs';

// ═══════════════════════════════════════════════════════════
// ── 数据读写 ────────────────────────────────
// ═══════════════════════════════════════════════════════════

function getToday() {
  return new Date().toISOString().slice(0,10);
}

function loadAllLogs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveAllLogs(logs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
}

function getTodayLog() {
  const today = getToday();
  return loadAllLogs().find(l => l.date === today) || null;
}

function saveTodayLog(data) {
  const logs = loadAllLogs();
  const today = getToday();
  const idx = logs.findIndex(l => l.date === today);
  data.date = today;
  if (idx >= 0) logs[idx] = data;
  else logs.push(data);
  saveAllLogs(logs);

  // 同步到 Supabase，女儿端可读
  syncToSupabase(data);
}

async function syncToSupabase(data) {
  try {
    const code = localStorage.getItem('stacy_invite_code');
    if (!code) return;
    await fetch(`${window.SUPABASE_URL}/rest/v1/daily_logs`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': window.SUPABASE_KEY,
        'Authorization': `Bearer ${window.SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        invite_code: code,
        date: data.date,
        mood: data.mood || '',
        sleep_score: data.sleep_score || 0,
        symptoms: data.symptoms || [],
        note: data.note || ''
      })
    });
  } catch (e) { console.warn('Supabase 同步失败:', e); }
}

// ═══════════════════════════════════════════════════════════
// ── 渲染 ──────────────────────────────────
// ═══════════════════════════════════════════════════════════

function renderCheckin() {
  const container = document.getElementById('checkin-content');
  const todayLog = getTodayLog();

  if (todayLog) {
    renderCheckinDone(container, todayLog);
  } else {
    renderCheckinForm(container);
  }
}

function renderCheckinDone(container, log) {
  const moodLabel = MOODS.find(m => m.emoji === log.mood);
  const symptomsStr = (log.symptoms || []).map(s => SYMPTOM_LABEL_MAP[s] || s).join('、') || '无';
  const sleepStr = log.sleep_score ? log.sleep_score + '分' : '';
  const parts = [];
  if (moodLabel) parts.push('心情' + moodLabel.label);
  if (sleepStr) parts.push('睡眠' + sleepStr);
  if (symptomsStr !== '无') parts.push(symptomsStr);
  if (log.note) parts.push('"' + log.note + '"');

  container.innerHTML = `
    <div class="checkin-done">
      <div class="icon">✅</div>
      <div class="summary">${parts.join(' · ')}</div>
      <div class="time">今天已打卡 · 跟 Stacy 聊聊今天的感受吧</div>
    </div>`;
}

function renderCheckinForm(container) {
  container.innerHTML = `
    <div class="field-row">
      <span class="field-label">心情</span>
      <div class="mood-picker" id="mood-picker">
        ${MOODS.map(m => `<button class="mood-btn" data-value="${m.emoji}" title="${m.label}">${m.emoji}</button>`).join('')}
      </div>
    </div>
    <div class="field-row">
      <span class="field-label">睡眠</span>
      <div class="sleep-picker" id="sleep-picker">
        ${[1,2,3,4,5].map(n => `<button class="sleep-btn" data-value="${n}">${n}</button>`).join('')}
      </div>
    </div>
    <div class="field-row">
      <span class="field-label">症状</span>
      <div class="tag-picker" id="tag-picker">
        ${SYMPTOM_TAGS.map(t => `<button class="tag-btn" data-value="${t.key}">${t.label}</button>`).join('')}
      </div>
    </div>
    <div class="field-row">
      <span class="field-label">备注</span>
      <input class="note-input" id="note-input" placeholder="还想说什么…" maxlength="60">
    </div>
    <button class="submit-btn" id="submit-btn">记录今天的感受</button>
  `;

  bindFormEvents();
}

function bindFormEvents() {
  let selectedMood = null;
  let selectedSleep = null;
  const selectedTags = new Set();

  const moodPicker = document.getElementById('mood-picker');
  const sleepPicker = document.getElementById('sleep-picker');
  const tagPicker = document.getElementById('tag-picker');
  const submitBtn = document.getElementById('submit-btn');

  moodPicker.addEventListener('click', e => {
    const btn = e.target.closest('.mood-btn');
    if (!btn) return;
    moodPicker.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.value;
    updateSubmit();
  });

  sleepPicker.addEventListener('click', e => {
    const btn = e.target.closest('.sleep-btn');
    if (!btn) return;
    sleepPicker.querySelectorAll('.sleep-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedSleep = parseInt(btn.dataset.value);
    updateSubmit();
  });

  tagPicker.addEventListener('click', e => {
    const btn = e.target.closest('.tag-btn');
    if (!btn) return;
    btn.classList.toggle('selected');
    if (btn.classList.contains('selected')) selectedTags.add(btn.dataset.value);
    else selectedTags.delete(btn.dataset.value);
    updateSubmit();
  });

  function updateSubmit() {
    submitBtn.disabled = !selectedMood;
  }

  submitBtn.addEventListener('click', () => {
    if (!selectedMood) return;
    saveTodayLog({
      mood: selectedMood,
      sleep_score: selectedSleep || 0,
      symptoms: [...selectedTags],
      note: document.getElementById('note-input').value.trim()
    });
    renderCheckin();
    renderTask();
  });
}

// ═══════════════════════════════════════════════════════════

//    根据打卡+档案选任务，日期做种子保证每天不重样
// ═══════════════════════════════════════════════════════════

    { t:'睡前开窗通风10分钟，让卧室凉爽一点', h:'入睡时室温低一点有助于深层睡眠', icon:'🪟' },
  ],

    { t:'睡前泡脚15分钟，水温热但不烫', h:'脚暖了身体会自然降温，帮助入睡', icon:'🦶' },
    { t:'今晚提前半小时上床，不要等困了再睡', h:'熬夜会让皮质醇升高，第二天更难睡', icon:'🛏️' },

    { t:'下午3点起来活动2分钟，伸个懒腰就好', h:'别让身体一下午都陷在沙发或椅子里', icon:'🕒' },
    { t:'找一个人说一句谢谢，发微信也算', h:'感恩是免费的正面情绪来源', icon:'💛' },
    { t:'今天太阳好的话，出去晒10分钟', h:'晒太阳帮助身体合成维D，对骨骼和情绪都好', icon:'☀️' },
    { t:'今天有意识地放慢一次呼吸——吸气数4、呼气数6', h:'一次就够了，不用做大冥想', icon:'😮‍💨' },
  ],
};

const TASKS_KEY = 'stacy_task_status';

function getTaskStatus() {
  const today = getToday();
  try {
    const status = JSON.parse(localStorage.getItem(TASKS_KEY) || '{}');
    return { date: status.date, done: status.date === today && status.done };
  } catch { return { date: null, done: false }; }
}

function markTaskDone() {
  const today = getToday();
  localStorage.setItem(TASKS_KEY, JSON.stringify({ date: today, done: true }));
  renderTask();
}

function pickTask() {
  const todayLog = getTodayLog();
  let profile = {};
  try { profile = JSON.parse(localStorage.getItem('stacy_profile') || '{}'); } catch {}

  // 收集匹配条件
  const conditions = [];

  // 从打卡数据选
  if (todayLog) {
    if (todayLog.sleep_score && todayLog.sleep_score <= 2) conditions.push('poor_sleep');
    if (todayLog.mood === '😤' || todayLog.mood === '😢') conditions.push('mood_swing');
    if (todayLog.mood === '😴') conditions.push('poor_sleep');
    if (todayLog.symptoms) {
      todayLog.symptoms.forEach(s => {
        if (s !== 'none' && TASK_BANK[s]) conditions.push(s);
      });
    }
  }

  // 从档案补条件：运动少
  if (profile.exercise === 'rare' || profile.exercise === 'occasional') {
    conditions.push('low_exercise');
  }

  // 去重 + 收集候选任务池
  const unique = [...new Set(conditions)];
  let candidates = [];
  unique.forEach(key => {
    candidates = candidates.concat(TASK_BANK[key] || []);
  });

  // 没有匹配 → 用通用池
  if (candidates.length === 0) {
    candidates = [...TASK_BANK.general];
    // 混入 1-2 个通用任务以提高多样性
  }

  // 日期种子选取
  const seed = parseInt(getToday().replace(/-/g, ''));
  const idx = seed % candidates.length;
  // 把种子出来的 + 它后面一个放到前面，增加多样性
  const rotated = [...candidates.slice(idx), ...candidates.slice(0, idx)];
  return rotated[0];
}

function renderTask() {
  const card = document.getElementById('task-card');
  const bodyEl = document.getElementById('task-body');
  const hintEl = document.getElementById('task-hint');
  const btn = document.getElementById('task-done-btn');
  const status = getTaskStatus();

  if (status.done) {
    card.style.display = '';
    bodyEl.innerHTML = '✅ <span class="highlight">今天的任务完成啦</span>';
    hintEl.textContent = '任务完成是给自己最好的礼物。明天会有新的。';
    btn.textContent = '已完成';
    btn.className = 'task-done-btn done';
    btn.onclick = null;
    return;
  }

  const task = pickTask();
  card.style.display = '';
  bodyEl.innerHTML = `<span class="highlight">${task.icon}</span> ${task.t}`;
  hintEl.textContent = task.h;
  btn.textContent = '点我标记完成';
  btn.className = 'task-done-btn';
  btn.onclick = markTaskDone;
}

// ── 对话记录 ────────────────────────────────
// ═══════════════════════════════════════════════════════════

function renderLogs() {
  const listEl = document.getElementById('log-list');
  let logs = [];
  try { logs = JSON.parse(localStorage.getItem('stacy_logs') || '[]'); } catch {}
  if (!logs.length) return;
  const recent = logs.slice(-3).reverse();
  listEl.innerHTML = '';
  recent.forEach(log => {
    const time = log.time || (log.created_at ? new Date(log.created_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) : '');
    const msg = log.userMessage || log.user_message || '';
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `<div class="log-time">${escapeHTML(time)}</div><div class="log-preview">${escapeHTML(msg.slice(0,20))}${msg.length > 20 ? '…' : ''}</div>`;
    listEl.appendChild(item);
  });
}

function escapeHTML(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderWeeklyBanner() {
  const banner = document.getElementById('weekly-banner');
  const preview = document.getElementById('weekly-preview');
  const allLogs = loadAllLogs();
  if (allLogs.length < 2) { banner.style.display = 'none'; return; }
  const days = allLogs.length;
  const logs = JSON.parse(localStorage.getItem('stacy_logs') || '[]');
  const chats = logs.length;
  banner.style.display = '';
  preview.textContent = `打卡${days}天 · 对话${chats}次`;
}
